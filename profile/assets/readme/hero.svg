<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Mythos, a world development environment for novelists</title>
  <desc id="desc">The Mythos mark and name beside a reference graph: a series, its books and chapters, and the characters each chapter mentions.</desc>
  <defs>
    <mask id="bands" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M96 168H132M200 212H236M420 312V340M400 226V254" stroke="#000" stroke-width="16" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#F8F6F0"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#E5DFD4"/>
  <!-- the shelf mark: the series is the shelf, two books stand on it and two lie in a stack -->
  <g transform="translate(62 50) scale(0.0859)" fill="#A35A3C" mask="url(#bands)">
    <rect x="48" y="396" width="416" height="72" rx="20"/>
    <rect x="72" y="104" width="84" height="268" rx="18"/>
