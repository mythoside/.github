  <text x="64" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="400" fill="#55504A" text-anchor="start">for novelists writing a series</text>
  <text x="64" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8A847B" text-anchor="start">local-first · Markdown + YAML · source-available</text>
